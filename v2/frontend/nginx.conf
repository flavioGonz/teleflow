server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache largo para assets versionados (vite ya pone hash en filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api → backend (sólo cuando frontend y backend están en el mismo host).
    # En prod con dominios separados, conviene apuntar VITE_API_BASE al backend
    # y quitar este bloque.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — todas las rutas que no son archivos van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
