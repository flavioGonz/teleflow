; ─── TeleFlow: feature codes para login dinámico v4 ──────────────────
; *7700        → login agente con prefs guardadas
; *7700*<Q>    → login agente solo a la cola Q (override de prefs)
; *7701        → logout total del agente
; *7702        → pausar al agente (pide motivo)
; *7703        → despausar al agente

[from-internal-custom]
; ── *7700 — login con prefs guardadas ──
exten => *7700,1,NoOp(TeleFlow login from ${CALLERID(num)})
exten => *7700,n,Answer()
exten => *7700,n,Wait(0.4)
exten => *7700,n,Set(TIMEOUT(digit)=1.5)
exten => *7700,n,Set(TIMEOUT(response)=8)
exten => *7700,n,Background(custom/teleflow-pide-numero)
exten => *7700,n,Read(AGENT_NUM,,6,,2,1)
exten => *7700,n,GotoIf($["${LEN(${AGENT_NUM})}" < "2"]?bye)
exten => *7700,n,Background(custom/teleflow-pide-clave)
exten => *7700,n,Read(AGENT_PASS,,12,,2,1)
exten => *7700,n,GotoIf($["${LEN(${AGENT_PASS})}" < "1"]?bye)
exten => *7700,n,AGI(teleflow_agent_login.agi,${AGENT_NUM},${AGENT_PASS},${CALLERID(num)},validate)
exten => *7700,n,GotoIf($["${LOGIN_OK}" = "1"]?ok:fail)
exten => *7700,n(ok),Playback(custom/teleflow-acceso-correcto)
exten => *7700,n,System(/usr/bin/curl -s -m 5 "http://10.1.1.192/api/agent_commit.php?agent=${AGENT_NUM}&pass=${AGENT_PASS}&ext=${CALLERID(num)}" >/dev/null 2>&1 &)
exten => *7700,n,Hangup()
exten => *7700,n(fail),Playback(custom/teleflow-acceso-denegado)
exten => *7700,n,Hangup()
exten => *7700,n(bye),Playback(vm-goodbye)
exten => *7700,n,Hangup()

; ── *7700*Q — login solo a la cola Q (ej: *7700*9100) ──
exten => _*7700*X.,1,NoOp(TeleFlow login a cola específica ${EXTEN:6} from ${CALLERID(num)})
exten => _*7700*X.,n,Set(TARGET_QUEUE=${EXTEN:6})
exten => _*7700*X.,n,Answer()
exten => _*7700*X.,n,Wait(0.4)
exten => _*7700*X.,n,Set(TIMEOUT(digit)=1.5)
exten => _*7700*X.,n,Set(TIMEOUT(response)=8)
exten => _*7700*X.,n,Background(custom/teleflow-pide-numero)
exten => _*7700*X.,n,Read(AGENT_NUM,,6,,2,1)
exten => _*7700*X.,n,GotoIf($["${LEN(${AGENT_NUM})}" < "2"]?bye2)
exten => _*7700*X.,n,Background(custom/teleflow-pide-clave)
exten => _*7700*X.,n,Read(AGENT_PASS,,12,,2,1)
exten => _*7700*X.,n,GotoIf($["${LEN(${AGENT_PASS})}" < "1"]?bye2)
exten => _*7700*X.,n,AGI(teleflow_agent_login.agi,${AGENT_NUM},${AGENT_PASS},${CALLERID(num)},validate)
exten => _*7700*X.,n,GotoIf($["${LOGIN_OK}" = "1"]?ok2:fail2)
exten => _*7700*X.,n(ok2),Playback(custom/teleflow-acceso-correcto)
exten => _*7700*X.,n,System(/usr/bin/curl -s -m 5 "http://10.1.1.192/api/agent_commit.php?agent=${AGENT_NUM}&pass=${AGENT_PASS}&ext=${CALLERID(num)}&queue=${TARGET_QUEUE}" >/dev/null 2>&1 &)
exten => _*7700*X.,n,Hangup()
exten => _*7700*X.,n(fail2),Playback(custom/teleflow-acceso-denegado)
exten => _*7700*X.,n,Hangup()
exten => _*7700*X.,n(bye2),Playback(vm-goodbye)
exten => _*7700*X.,n,Hangup()

; ── *7701 — logout ──
exten => *7701,1,NoOp(TeleFlow logout from ${CALLERID(num)})
exten => *7701,n,Answer()
exten => *7701,n,Wait(0.3)
exten => *7701,n,Playback(custom/teleflow-logout-ok)
exten => *7701,n,System(/usr/bin/curl -s -m 5 "http://10.1.1.192/api/agent_logout_commit.php?ext=${CALLERID(num)}" >/dev/null 2>&1 &)
exten => *7701,n,Hangup()

; ── *7702 — pausar (pide motivo). Sin "almuerzo". Cualquier dígito 0-9 → reason mapeado ──
exten => *7702,1,NoOp(TeleFlow pause from ${CALLERID(num)})
exten => *7702,n,Answer()
exten => *7702,n,Wait(0.3)
exten => *7702,n,Set(TIMEOUT(digit)=1.5)
exten => *7702,n,Set(TIMEOUT(response)=6)
exten => *7702,n,Background(custom/teleflow-pide-motivo)
exten => *7702,n,Read(REASON,,1,,2,1)
; Si no marca, asumimos pausa genérica PERSONAL (reason=0)
exten => *7702,n,Set(REASON=${IF($["${LEN(${REASON})}"<"1"]?0:${REASON})})
exten => *7702,n,Playback(custom/teleflow-pausa-activada)
exten => *7702,n,System(/usr/bin/curl -s -m 5 "http://10.1.1.192/api/agent_pause_commit.php?ext=${CALLERID(num)}&reason=${REASON}" >/dev/null 2>&1 &)
exten => *7702,n,Hangup()

; ── *7703 — despausar ──
exten => *7703,1,NoOp(TeleFlow unpause from ${CALLERID(num)})
exten => *7703,n,Answer()
exten => *7703,n,Wait(0.3)
exten => *7703,n,Playback(custom/teleflow-pausa-finalizada)
exten => *7703,n,System(/usr/bin/curl -s -m 5 "http://10.1.1.192/api/agent_unpause_commit.php?ext=${CALLERID(num)}" >/dev/null 2>&1 &)
exten => *7703,n,Hangup()
