<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11B328">
<title>Sin conexión · Teleflow</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0a0d; color: #e5e7eb; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; background-image: radial-gradient(circle at 18% 22%, rgba(17, 179, 40, 0.12) 0%, transparent 45%), radial-gradient(circle at 82% 78%, rgba(17, 179, 40, 0.08) 0%, transparent 50%); }
  .icon { width: 96px; height: 96px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #11B328, #0a6e1a); box-shadow: 0 12px 32px rgba(17, 179, 40, 0.25), inset 0 1px 0 rgba(255,255,255,0.15); margin-bottom: 28px; font-size: 50px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
  p { font-size: 14px; color: #94a3b8; max-width: 380px; line-height: 1.55; margin-bottom: 28px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button, a.btn { appearance: none; border: 1px solid #1f2937; background: #14171f; color: #e5e7eb; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
  button.primary, a.btn.primary { background: linear-gradient(135deg, #11B328, #0a8f1f); border-color: transparent; color: white; box-shadow: 0 4px 14px rgba(17, 179, 40, 0.3); }
  button:hover, a.btn:hover { transform: translateY(-1px); }
  .status { margin-top: 28px; display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: #6b7280; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid #1f2937; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .online .dot { background: #11B328; box-shadow: 0 0 8px #11B328; }
  footer { margin-top: 48px; font-size: 11px; color: #4b5563; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sin conexión</h1>
  <p>No pudimos contactar con el servidor de Teleflow. Verificá tu red o VPN y volvé a intentar.</p>
  <div class="actions">
    <button class="primary" onclick="location.reload()">Reintentar</button>
    <a class="btn" href="/" onclick="event.preventDefault(); location.assign('/');">Volver al inicio</a>
  </div>
  <div id="status" class="status"><span class="dot"></span><span id="statusLabel">Sin red</span></div>
  <footer>Teleflow Horizon</footer>
<script>
  function updateStatus() {
    const wrap = document.getElementById('status'); const lab = document.getElementById('statusLabel');
    if (navigator.onLine) { wrap.classList.add('online'); lab.textContent = 'Conexión restaurada · recargando…'; setTimeout(() => location.reload(), 800); }
    else { wrap.classList.remove('online'); lab.textContent = 'Sin red'; }
  }
  updateStatus(); window.addEventListener('online', updateStatus); window.addEventListener('offline', updateStatus);
</script>
</body>
</html>
